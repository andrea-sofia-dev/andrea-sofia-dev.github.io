name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every day, so a repository tagged with the "portfolio" topic shows up without touching this repo.
  # (GitHub pauses scheduled runs after 60 days with no activity here: re-enable them in the Actions tab.)
  schedule:
    - cron: '23 5 * * *'
  # "Run workflow" in the Actions tab updates the list right away.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # prebuild fetches the tagged repositories; the token only raises GitHub's rate limit.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
